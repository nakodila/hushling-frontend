<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>lallababy — your lullabies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14132b;
    --bg2:#211f4a;
    --card:#2b2854;
    --card-border:rgba(245,222,179,.14);
    --gold:#f5deb3;
    --gold-strong:#f0cf94;
    --lavender:#b6a4e8;
    --rose:#eeb3c8;
    --text:#f6f2ea;
    --text-dim:#a9a5cf;
    --text-faint:#726e9c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse 900px 600px at 78% 8%, var(--bg2), transparent 60%),
                radial-gradient(ellipse 700px 500px at 10% 90%, #241f4d, transparent 55%),
                var(--bg);
    color:var(--text);
    font-family:'Quicksand', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  .starfield{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .star{ position:absolute; background:var(--text); border-radius:50%; animation:twinkle ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }

  nav{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:26px 56px;
    border-bottom:1px solid var(--card-border);
  }
  .logo{ font-family:'Fraunces', serif; font-size:24px; font-style:italic; }
  .logo .hush{ color:var(--text); font-weight:500; }
  .logo .ling{ color:var(--gold); font-weight:600; }
  .navlinks{ display:flex; gap:36px; }
  .navlinks a{
    color:var(--text-dim); text-decoration:none; font-weight:600; font-size:15px;
    display:flex; align-items:center; gap:6px;
  }
  .navlinks a.active{ color:var(--text); }
  .navlinks a.active::before{ content:'✦'; color:var(--gold); font-size:10px; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--card); border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--gold); font-size:14px;
  }

  main{
    position:relative; z-index:2;
    display:grid; grid-template-columns: 1fr 1fr;
    gap:40px;
    padding:32px 56px 40px;
    align-items:start;
    max-width:1400px; margin:0 auto;
  }

  .section-label{
    font-size:13px; font-weight:700; letter-spacing:.18em;
    color:var(--gold); text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
    margin-bottom:22px;
  }
  .section-label::before{ content:'✦'; font-size:11px; }

  .cards{ display:flex; flex-direction:column; gap:20px; }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:26px;
    padding:26px 28px 22px;
    position:relative;
    overflow:hidden;
    box-shadow: 0 24px 60px -28px rgba(0,0,0,.65);
  }
  .card::after{
    content:'☾'; position:absolute; top:14px; right:20px;
    font-size:26px; color:var(--card-border); opacity:.6;
  }
  .card h3{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:26px; color:var(--text); margin-bottom:18px;
  }

  .player{
    background:var(--text);
    border-radius:999px;
    padding:10px 16px;
    display:flex; align-items:center; gap:12px;
    color:#23213f;
  }
  .playbtn{
    width:30px; height:30px; border-radius:50%; background:#23213f;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .playbtn svg{ width:11px; height:11px; }
  .time{ font-size:13px; font-weight:600; white-space:nowrap; }
  .bars{ display:flex; align-items:center; gap:2px; flex:1; height:20px; }
  .bars span{
    width:3px; background:#23213f; opacity:.35; border-radius:2px;
    animation:bar-pulse 1.1s ease-in-out infinite;
  }
  @keyframes bar-pulse{ 0%,100%{height:5px;} 50%{height:16px;} }
  .icon-sm{ width:16px; height:16px; opacity:.7; flex-shrink:0; }

  .ghost-card{
    border:2px dashed var(--card-border);
    border-radius:26px;
    padding:34px 28px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center;
    cursor:pointer;
    transition:.25s ease;
  }
  .ghost-card:hover{
    border-color:var(--gold);
    background:rgba(245,222,179,.04);
    transform:translateY(-2px);
  }
  .ghost-plus{
    width:38px; height:38px; border-radius:50%;
    border:1.5px solid var(--text-faint);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; color:var(--text-dim);
  }
  .ghost-card:hover .ghost-plus{ border-color:var(--gold); color:var(--gold); }
  .ghost-card h4{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size:19px; color:var(--text-dim);
  }
  .ghost-card p{ font-size:13px; color:var(--text-faint); }

  /* ---- hero / mascot side ---- */
  .hero{
    position:relative;
    min-height:520px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    gap:18px;
  }

  .cloud{ position:absolute; opacity:.55; filter:blur(.3px); animation:drift ease-in-out infinite alternate; }
  .cloud.c1{ top:8%; left:2%; width:150px; animation-duration:9s; }
  .cloud.c2{ top:60%; right:0%; width:120px; animation-duration:11s; animation-delay:1s; }
  .cloud.c3{ bottom:6%; left:12%; width:100px; animation-duration:8s; animation-delay:.5s; }
  @keyframes drift{ from{ transform:translateX(0);} to{ transform:translateX(26px);} }

  .moon-wrap{ position:relative; width:230px; animation:float 5s ease-in-out infinite; }
  @keyframes float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-14px);} }

  .topbar{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    max-width:1400px; margin:0 auto;
    padding:56px 56px 0;
  }
  .topbar .section-label{ margin-bottom:0; }

  .speech{
    font-family:'Fraunces', serif; font-style:italic; font-size:19px;
    color:var(--text-dim); max-width:280px; line-height:1.4;
  }

  .cta{
    background:var(--gold); color:#241f47;
    border:none; border-radius:999px; padding:16px 34px;
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; box-shadow:0 18px 40px -14px rgba(245,222,179,.45);
    transition:.2s ease;
  }
  .cta:hover{ background:var(--gold-strong); transform:translateY(-2px) scale(1.02); }

  footer{
    position:relative; z-index:2;
    text-align:center; padding:30px 0 46px;
    font-family:'Fraunces', serif; font-style:italic; font-size:14px;
    color:var(--text-faint);
  }

  @media (max-width: 880px){
    main{ grid-template-columns:1fr; padding:28px 24px 40px; }
    nav{ padding:20px 24px; }
    .topbar{ padding:36px 24px 0; flex-direction:column; align-items:flex-start; gap:18px; }
    .hero{ min-height:380px; }
  }
</style>
</head>
<body>

<div class="starfield" id="starfield"></div>

<nav>
  <div class="logo"><span class="hush">lalla</span><span class="ling">baby</span></div>
  <div class="navlinks">
    <a href="#" class="active">Your lullabies</a>
    <a href="#">Create</a>
  </div>
  <div class="avatar">E</div>
</nav>

<div class="topbar">
  <div class="section-label">Your lullabies</div>
  <button class="cta">Create a new lullaby</button>
</div>

<main>
  <div>
    <div class="cards">
      <div class="card">
        <h3>Dreamy Sands</h3>
        <div class="player">
          <div class="playbtn">
            <svg viewBox="0 0 24 24" fill="#f6f2ea"><rect x="5" y="4" width="4" height="16" rx="1"/><rect x="15" y="4" width="4" height="16" rx="1"/></svg>
          </div>
          <span class="time">2:47 / 3:34</span>
          <div class="bars">
            <span style="animation-delay:0s"></span><span style="animation-delay:.1s"></span>
            <span style="animation-delay:.2s"></span><span style="animation-delay:.3s"></span>
            <span style="animation-delay:.15s"></span><span style="animation-delay:.25s"></span>
            <span style="animation-delay:.05s"></span><span style="animation-delay:.35s"></span>
          </div>
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="#23213f" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M19 9a5 5 0 0 1 0 6"/></svg>
        </div>
      </div>

      <div class="ghost-card">
        <div class="ghost-plus">+</div>
        <h4>Start a new dream</h4>
        <p>Turn tonight's story into a lullaby</p>
      </div>
    </div>
  </div>

  <div class="hero">
    <svg class="cloud c1" viewBox="0 0 200 100"><ellipse cx="60" cy="60" rx="55" ry="30" fill="#3a3670"/><ellipse cx="110" cy="45" rx="45" ry="28" fill="#3a3670"/><ellipse cx="150" cy="65" rx="35" ry="22" fill="#3a3670"/></svg>
    <svg class="cloud c2" viewBox="0 0 200 100"><ellipse cx="60" cy="60" rx="55" ry="30" fill="#2f2b60"/><ellipse cx="110" cy="45" rx="45" ry="28" fill="#2f2b60"/></svg>
    <svg class="cloud c3" viewBox="0 0 200 100"><ellipse cx="60" cy="60" rx="50" ry="28" fill="#332f66"/><ellipse cx="120" cy="55" rx="40" ry="24" fill="#332f66"/></svg>

    <div class="moon-wrap">
      <svg viewBox="0 0 220 220" width="100%">
        <ellipse cx="110" cy="185" rx="70" ry="16" fill="#2f2b60" opacity=".8"/>
        <path d="M130 30
                 a80 80 0 1 0 0 150
                 a95 95 0 0 1 0 -150 Z"
              fill="#f5deb3"/>
        <path d="M78 96
                 q9 -9 18 0" stroke="#241f47" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M110 96
                 q9 -9 18 0" stroke="#241f47" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="80" cy="112" r="8" fill="#eeb3c8" opacity=".55"/>
        <circle cx="128" cy="112" r="8" fill="#eeb3c8" opacity=".55"/>
        <path d="M96 118 q8 8 16 0" stroke="#241f47" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M60 46 L100 32 L86 66 Z" fill="#b6a4e8"/>
        <circle cx="60" cy="46" r="8" fill="#b6a4e8"/>
      </svg>
    </div>

    <p class="speech">shall we dream up something new tonight?</p>
  </div>
</main>

<footer>handcrafted lullabies, one hush at a time ✦</footer>

<script>
  const field = document.getElementById('starfield');
  const n = 70;
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2.4 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.top = Math.random()*100+'%';
    s.style.left = Math.random()*100+'%';
    s.style.animationDuration = (Math.random()*3 + 2)+'s';
    s.style.animationDelay = (Math.random()*4)+'s';
    field.appendChild(s);
  }
</script>

</body>
</html>
